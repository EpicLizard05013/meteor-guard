name: MeteorGuard
version: '1.3'
main: com.meteorsmp.antiesp.AntiESPPlugin
api-version: '1.21'
depend: [packetevents]
softdepend: [GrimAC, floodgate, LuckPerms]
description: AntiFreecam (always on), anti-ESP, container hiding, join protection, item checks, and staff alerts.

commands:
  meteor:
    description: Main administrative command for MeteorGuard
    usage: /<command> [help|control|status|antiesp|antifreecam|perf|inspect|suspicious|reload|toggle|bypass|alerts|attack|scan]
    aliases: [meteorguard]
  suspicious:
    description: Open the suspicious players ore log GUI
    usage: /<command>

permissions:
  meteorguard.admin:
    description: Allows full administrative access to MeteorGuard commands
    default: op
  meteorguard.suspicious:
    description: Allows access to /suspicious and /meteorguard suspicious
    default: op
  meteorguard.seecommands:
    description: See every command in tab-complete and use plugin-list commands
    default: op
  antifreecam.admin:
    default: op
  antifreecam.bypass:
    default: false
  antiesp.bypass:
    default: false
  meteorshield.alerts:
    default: op
  meteorshield.bypass:
    default: false
