name: MeteorGuard
version: '1.2'
main: com.meteorsmp.antiesp.AntiESPPlugin
api-version: '1.21'
softdepend: [GrimAC, floodgate, LuckPerms, packetevents]
description: Advanced anti-ESP, container hiding, join protection, item checks, and staff alerts.

commands:
  meteorguard:
    description: Main administrative command for MeteorGuard
    permission: meteorguard.admin
    usage: /<command> [help|control|reload|toggle|status|bypass|alerts|attack|scan]
    aliases: [meteor, antiesp, shield, antifreecam]

permissions:
  meteorguard.admin:
    description: Allows full administrative access to MeteorGuard commands
    default: op
  meteorguard.seecommands:
    description: See every command in tab-complete and use plugin-list commands
    default: op
  antifreecam.admin:
    default: op
  antifreecam.bypass:
    default: false
  antiesp.bypass:
    default: false
  meteorshield.alerts:
    default: op
  meteorshield.bypass:
    default: false
